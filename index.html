<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>动态太阳系 · Solar System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <!-- 顶部控制条 -->
  <header id="topbar">
    <button id="menuToggle" class="icon-btn" title="展开/收起菜单">☰</button>
    <div class="brand">☀ 动态太阳系</div>
    <div class="controls">
      <button id="pauseBtn" class="ctrl-btn" title="播放/暂停">⏸</button>
      <label class="speed-label">
        速度
        <input type="range" id="speedSlider" min="1" max="500" value="30">
        <span id="speedValue">30x</span>
      </label>
      <label class="check"><input type="checkbox" id="orbitToggle" checked> 轨道</label>
      <label class="check"><input type="checkbox" id="labelToggle" checked> 标签</label>
      <label class="check"><input type="checkbox" id="beltToggle" checked> 小行星带</label>
      <span id="timeDisplay" class="time-display">运行 0 天</span>
    </div>
  </header>

  <!-- 侧边菜单 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span>太阳系导航</span>
      <button id="sidebarClose" class="icon-btn" title="收起菜单">«</button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="搜索星球…">
    </div>
    <nav id="bodyList"></nav>
    <div class="sidebar-footer">
      <button id="resetView" class="ctrl-btn full">⟲ 重置视角</button>
    </div>
  </aside>
  <div id="sidebarMask"></div>

  <!-- 星体信息面板 -->
  <div id="infoPanel" class="hidden">
    <button id="infoClose" class="icon-btn" title="关闭">✕</button>
    <button id="infoCollapse" class="icon-btn" title="收起/展开">–</button>
    <h2 id="infoName"></h2>
    <p id="infoType" class="info-type"></p>
    <div class="info-facts" id="infoFacts"></div>
    <p id="infoDesc" class="info-desc"></p>
  </div>

  <!-- 跟随提示 -->
  <div id="followBadge" class="follow-badge hidden">
    <span>跟随中 · <b id="followName"></b></span>
    <button id="followCancel" class="icon-btn mini" title="取消跟随">✕</button>
  </div>

  <!-- 事件信息卡 -->
  <div id="eventCard" class="event-card hidden">
    <div class="event-head">
      <span id="eventTitle"></span>
      <span class="event-btns">
        <button id="eventCollapse" class="icon-btn mini" title="收起/展开">–</button>
        <button id="eventClose" class="icon-btn mini" title="关闭">✕</button>
      </span>
    </div>
    <div class="event-body">
      <div class="event-year" id="eventYear"></div>
      <p id="eventDesc"></p>
    </div>
  </div>

  <!-- 操作提示 -->
  <div id="hint">
    左键拖拽旋转 · 滚轮缩放 · 右键平移 · 点击星球或侧边菜单定位
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>正在加载太阳系…</p>
    <p id="loadingStatus" class="loading-hint">正在连接资源服务器…</p>
    <button id="retryBtn" class="ctrl-btn hidden" style="margin-top:12px;">重新加载</button>
  </div>

  <script>
  (function () {
    // 资源加载器：优先走国内可达性更好的 CDN，失败自动回退到本地文件
    var threeSources = [
      "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
      "js/three.min.js"
    ];
    var orbitSources = [
      "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js",
      "https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js",
      "js/OrbitControls.js"
    ];

    function status(text) {
      var el = document.getElementById("loadingStatus");
      if (el) el.textContent = text;
    }
    function showRetry() {
      var btn = document.getElementById("retryBtn");
      if (btn) btn.classList.remove("hidden");
    }
    function load(src, timeoutMs) {
      return new Promise(function (resolve) {
        var s = document.createElement("script");
        var done = false;
        var timer = setTimeout(function () {
          if (!done) {
            done = true;
            s.onload = s.onerror = null;
            resolve(false);
          }
        }, timeoutMs);
        s.onload = function () {
          if (!done) {
            done = true;
            clearTimeout(timer);
            resolve(true);
          }
        };
        s.onerror = function () {
          if (!done) {
            done = true;
            clearTimeout(timer);
            resolve(false);
          }
        };
        s.src = src;
        document.head.appendChild(s);
      });
    }
    async function tryChain(list, check, label) {
      for (var i = 0; i < list.length; i++) {
        status("正在下载" + label + "…");
        var ok = await load(list[i], 7000);
        if (ok && check()) return true;
      }
      return false;
    }
    function webglOk() {
      try {
        var c = document.createElement("canvas");
        return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl")));
      } catch (e) {
        return false;
      }
    }
    document.getElementById("retryBtn").addEventListener("click", function () {
      location.reload();
    });

    (async function () {
      var threeOk = await tryChain(threeSources, function () { return !!window.THREE; }, "3D 引擎");
      if (!threeOk) {
        status("3D 引擎下载失败：网络可能无法访问资源服务器，请检查网络后重试");
        showRetry();
        return;
      }
      var orbitOk = await tryChain(orbitSources, function () { return !!window.THREE && !!window.THREE.OrbitControls; }, "视角组件");
      if (!orbitOk) {
        status("视角组件下载失败：网络可能无法访问资源服务器，请检查网络后重试");
        showRetry();
        return;
      }
      if (!webglOk()) {
        status("此设备浏览器不支持 3D 图形（WebGL），无法打开太阳系。请更换 Chrome / Edge 等新版浏览器");
        showRetry();
        return;
      }
      status("正在初始化太阳系…");
      var appOk = await load("js/app.js", 20000);
      if (!appOk) {
        status("主程序下载失败：网络可能无法访问资源服务器，请检查网络后重试");
        showRetry();
        return;
      }
      // 兜底：若 25 秒后加载层仍未隐藏，提示用户重试
      setTimeout(function () {
        var loading = document.getElementById("loading");
        if (loading && !loading.classList.contains("hide")) {
          status("加载超时：可能是网络不稳定，请点击下方按钮重试");
          showRetry();
        }
      }, 25000);
    })();
  })();
  </script>
</body>
</html>
